services:
  portfolio-web:
    image: nginx:alpine
    container_name: portfolio-web
    ports:
      - "8482:80"
    volumes:
      - portfolio-dist:/usr/share/nginx/html:ro
      - /container/config/personal_projects/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - portfolio-builder
      - portfolio-chat
      - portfolio-api

  portfolio-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: portfolio-api
    volumes:
      # Read-only project metadata, published documents/images and stats
      - /container/config/personal_projects/config:/app/config:ro
      - /container/data/personal_projects/public:/app/public:ro
      # Read-only private repositories and personal context documents
      - /container/data/personal_projects/repos:/app/repos:ro
      - ./extra-repos:/app/extra-repos:ro
      - /container/data/personal_projects/context:/app/context:ro
      - ./data/repo-summaries:/app/data/repo-summaries:ro
    environment:
      - PORTFOLIO_API_PORT=3002
      - PORTFOLIO_API_HOST=0.0.0.0
      - PORTFOLIO_API_PUBLIC_BASE_URL=${PORTFOLIO_API_PUBLIC_BASE_URL:-https://projects.christian-f-brinkmann.de}
      - PORTFOLIO_API_USERS=${PORTFOLIO_API_USERS:-}
      - PORTFOLIO_API_USER=${PORTFOLIO_API_USER:-}
      - PORTFOLIO_API_PASSWORD=${PORTFOLIO_API_PASSWORD:-}
      - PORTFOLIO_API_RATE_LIMIT_PUBLIC=${PORTFOLIO_API_RATE_LIMIT_PUBLIC:-300}
      - PORTFOLIO_API_RATE_LIMIT_PRIVATE=${PORTFOLIO_API_RATE_LIMIT_PRIVATE:-600}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  portfolio-chat:
    build:
      context: .
      dockerfile: Dockerfile.chat
    container_name: portfolio-chat
    volumes:
      # Mount AI env for Gemini credentials (read-only)
      - /scripts/ai.env:/run/secrets/ai.env:ro
      # Mount config and repos strictly read-only for security jail
      - /container/config/personal_projects/config:/app/config:ro
      - /container/data/personal_projects/repos:/app/repos:ro
      - /data/backups:/data/backups:ro
      - ./extra-repos:/app/extra-repos:ro
      # Mount personal context documents (read-only)
      - /container/data/personal_projects/context:/app/context:ro
      # Mount pre-computed codebase summaries (read-only)
      - ./data/repo-summaries:/app/data/repo-summaries:ro
      # Persistent cache/state volume for quota tracking
      - chat-data:/app/data
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_MENTION_ID=${DISCORD_MENTION_ID:-}
      - PAID_CHAT_BUDGET_24H=${PAID_CHAT_BUDGET_24H:-0.10}
    restart: unless-stopped

  portfolio-builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    container_name: portfolio-builder
    user: root
    volumes:
      # We need the SSH keys for auth
      - /root/.ssh:/root/.ssh:ro
      # Mount AI env for project translation (read-only)
      - /scripts/ai.env:/run/secrets/ai.env:ro
      # Mount config and repos to watch/read changes
      - /container/config/personal_projects/config:/app/config
      - /container/data/personal_projects/repos:/app/repos
      # Mount unlisted / extra repos and backup directory for activity tracking
      - /data/backups:/data/backups:ro
      - ./extra-repos:/app/extra-repos:ro
      # Mount translations persistent cache
      - /container/data/personal_projects/translations:/app/data/translations
      # Mount public to write compiled images and stats.json back to host
      - /container/data/personal_projects/public:/app/public
      # Mount src, scripts and index.html for live builds
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./index.html:/app/index.html
      - ./data/repo-summaries:/app/data/repo-summaries
      # Shared volume for built assets served by Nginx
      - portfolio-dist:/app/dist
      - /container/config/personal_projects/vite.config.ts:/app/vite.config.ts:ro
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - STATS_UPDATE_INTERVAL_HOURS=6
      - WATCH_BUILD_CMD=npm run build
    restart: unless-stopped

volumes:
  portfolio-dist:
  chat-data:
