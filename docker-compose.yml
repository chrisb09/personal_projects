services:
  portfolio-web:
    image: nginx:alpine
    container_name: portfolio-web
    ports:
      - "8482:80"
    volumes:
      - portfolio-dist:/usr/share/nginx/html:ro
      - /container/config/personal_projects/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - portfolio-builder
      - portfolio-chat

  portfolio-chat:
    build:
      context: .
      dockerfile: Dockerfile.chat
    container_name: portfolio-chat
    volumes:
      # Mount AI env for Gemini credentials (read-only)
      - /scripts/ai.env:/run/secrets/ai.env:ro
      # Mount config and repos strictly read-only for security jail
      - /container/config/personal_projects/config:/app/config:ro
      - /container/data/personal_projects/repos:/app/repos:ro
      - /data/backups:/data/backups:ro
      - ./extra-repos:/app/extra-repos:ro
      # Persistent cache/state volume for quota tracking
      - chat-data:/app/data
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
    restart: unless-stopped

  portfolio-builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    container_name: portfolio-builder
    user: root
    volumes:
      # We need the SSH keys for auth
      - /root/.ssh:/root/.ssh:ro
      # Mount AI env for project translation (read-only)
      - /scripts/ai.env:/run/secrets/ai.env:ro
      # Mount config and repos to watch/read changes
      - /container/config/personal_projects/config:/app/config
      - /container/data/personal_projects/repos:/app/repos
      # Mount unlisted / extra repos and backup directory for activity tracking
      - /data/backups:/data/backups:ro
      - ./extra-repos:/app/extra-repos:ro
      # Mount translations persistent cache
      - /container/data/personal_projects/translations:/app/data/translations
      # Mount public to write compiled images and stats.json back to host
      - /container/data/personal_projects/public:/app/public
      ## Mount src to write src/config/projects.ts
      ###- /container/config/personal_projects/projects.ts:/app/src/config/projects.ts
      # Shared volume for built assets served by Nginx
      - portfolio-dist:/app/dist
      - /container/config/personal_projects/vite.config.ts:/app/vite.config.ts:ro
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - STATS_UPDATE_INTERVAL_HOURS=6
      - WATCH_BUILD_CMD=npm run build
    restart: unless-stopped

volumes:
  portfolio-dist:
  chat-data:
